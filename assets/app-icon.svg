<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f80ff"/>
      <stop offset="1" stop-color="#0b3fb0"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6eeff"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#04205e" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Full-bleed square background (Shopify rounds the corners itself) -->
  <rect width="1200" height="1200" fill="url(#bg)"/>

  <!-- Ground rings under the pin: "nearby" -->
  <ellipse cx="600" cy="975" rx="300" ry="62" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="16"/>
  <ellipse cx="600" cy="975" rx="170" ry="34" fill="#ffffff" fill-opacity="0.28"/>

  <!-- Map pin: spans y 150–975 (825px, inside Shopify's 750–900px guide) -->
  <path filter="url(#shadow)" fill="url(#pin)"
        d="M600 150
           C 405 150 260 298 260 486
           C 260 700 480 860 600 975
           C 720 860 940 700 940 486
           C 940 298 795 150 600 150 Z"/>

  <!-- Storefront inside the pin -->
  <g transform="translate(600 478)">
    <circle r="195" fill="#ee6d4a"/>
    <!-- striped awning with a scalloped edge -->
    <path fill="#ffffff" d="M-110 -96 H110 L136 -22 A34 34 0 0 1 68 -22 A34 34 0 0 1 0 -22 A34 34 0 0 1 -68 -22 A34 34 0 0 1 -136 -22 Z"/>
    <path fill="#ee6d4a" opacity="0.28" d="M-55 -96 h36 l-6 74 h-36 z M19 -96 h36 l12 74 h-36 z"/>
    <!-- shop body + door -->
    <rect x="-104" y="26" width="208" height="110" rx="12" fill="#ffffff"/>
    <rect x="-28" y="58" width="56" height="78" rx="8" fill="#ee6d4a"/>
  </g>
</svg>
