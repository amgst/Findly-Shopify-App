# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "3c3ce66c45a276e64f33196ddc472053"
name = "closeme"
application_url = "https://example.com"
embedded = true

[access_scopes]
# read_locations: import and auto-sync the shop's Shopify Locations
scopes = "read_locations"

[auth]
redirect_urls = [ "https://example.com/auth/callback" ]

# Storefront page at https://{shop}/apps/locator (and /apps/locator/frame for the theme block)
[app_proxy]
url = "/proxy"
subpath = "locator"
prefix = "apps"

[webhooks]
api_version = "2027-01"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/locations"
  topics = [ "locations/create", "locations/update", "locations/delete" ]

  # Mandatory privacy compliance topics for App Store apps
  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true
